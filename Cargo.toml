[package]
name = "sops-lint"
version = "0.1.0"
edition = "2021"
description = "A linter that understands SOPS: catches secrets that escaped encryption and files SOPS wouldn't actually cover."
license = "MIT OR Apache-2.0"
repository = "https://github.com/eldpcn/sops-lint"

[[bin]]
name = "sops-lint"
path = "src/main.rs"

[lib]
name = "sops_lint"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
regex = "1"
ignore = "0.4"
anyhow = "1"
pathdiff = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
